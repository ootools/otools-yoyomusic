name: release-plugin
run-name: "YoYoMusic 六目标 · ${{ github.ref_name }}"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yoyomusic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify version tag
        run: |
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("plugin.json"));if(process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!==`v${m.version}`)throw new Error("Tag and manifest versions differ");'
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yoyomusic-web
          path: dist/
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - id: windows-arm64
            runner: windows-2022
            target: aarch64-pc-windows-msvc
          - id: macos-x64
            runner: macos-14
            target: x86_64-apple-darwin
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - id: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native boundary tests
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Build actual target library
        env:
          RUSTFLAGS: ${{ (matrix.id == 'windows-x64' || matrix.id == 'windows-arm64') && '-C target-feature=+crt-static' || '' }}
        run: node scripts/build-native.mjs --target ${{ matrix.target }} --out lib/${{ matrix.id }}
      - name: Verify OS, architecture and ABI
        shell: bash
        env:
          NATIVE_ID: ${{ matrix.id }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";import {NATIVE_TARGETS,inspectNative} from "./scripts/package-matrix.mjs";const t=NATIVE_TARGETS.find(v=>v.id===process.env.NATIVE_ID);console.log(inspectNative(fs.readFileSync(`lib/${t.id}/${t.file}`),t.id));'
      - uses: actions/upload-artifact@v4
        with:
          name: yoyomusic-native-${{ matrix.id }}
          path: lib/${{ matrix.id }}/
          if-no-files-found: error

  package:
    needs: [web, native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: yoyomusic-web
          path: dist
      - name: Download six platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: yoyomusic-native-*
          path: native-artifacts
      - name: Stage verified libraries
        run: |
          node --input-type=module -e 'import fs from "node:fs";import {NATIVE_TARGETS,inspectNative} from "./scripts/package-matrix.mjs";for(const t of NATIVE_TARGETS){const s=`native-artifacts/yoyomusic-native-${t.id}/${t.file}`;const bytes=fs.readFileSync(s);inspectNative(bytes,t.id);fs.mkdirSync(`lib/${t.id}`,{recursive:true});fs.copyFileSync(s,`lib/${t.id}/${t.file}`);}'
      - name: Package six native targets and market compatibility bundles
        run: node scripts/release-packages.mjs --libs lib --out dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: yoyomusic-release
          path: dist-release/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "YoYoMusic $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/*.oplg dist-release/plugin.json dist-release/logo.svg dist-release/SHA256SUMS dist-release/release-assets.json --clobber
